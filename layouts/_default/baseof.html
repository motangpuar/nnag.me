<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/chroma.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="nav-name">YM</a>
  
      <button class="nav-toggle"
              aria-label="Toggle menu"
              aria-expanded="false"
              aria-controls="nav-links">
        <span></span>
        <span></span>
        <span></span>
      </button>
  
      <div class="nav-links" id="nav-links">
        <a href="/projects/">Projects</a>
        <a href="/posts/">Writing</a>
        <a href="/about/">About</a>
      </div>
    </nav>
  </header>
  <main>
    {{- block "main" . }}{{- end }}
  </main>
  <footer>
    <div class="footer-inner">
      <span>{{ .Site.Title }}</span>
      <div class="footer-links">
        {{ range .Site.Params.socialIcons }}
        <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
        {{ end }}
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var zoom = mediumZoom('.post-content figure.img-figure img', {
        margin: 24,
        background: 'var(--bg)',
        scrollOffset: 0
      });
    });
  </script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const refs = document.querySelectorAll('.ref-item');
    const map = {};
    refs.forEach((el, i) => {
      const id = el.dataset.refId;
      const num = i + 1;
      map[id] = num;
      el.querySelector('.ref-num').textContent = '[' + num + ']';
    });
    document.querySelectorAll('.cite-link').forEach(el => {
      const id = el.dataset.ref;
      if (map[id]) el.textContent = '[' + map[id] + ']';
    });
  });
  </script>
  <script>
  (() => {
    const toggle = document.querySelector('.nav-toggle');
    const links  = document.getElementById('nav-links');
    const body   = document.body;
    if (!toggle || !links) return;
  
    const setOpen = (open) => {
      toggle.setAttribute('aria-expanded', String(open));
      links.classList.toggle('is-open', open);
      body.classList.toggle('nav-open', open);
    };
  
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
  
    // Close when a link is tapped (page will navigate anyway)
    links.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') setOpen(false);
    });
  
    // Close on outside tap
    document.addEventListener('click', (e) => {
      if (toggle.getAttribute('aria-expanded') !== 'true') return;
      if (!links.contains(e.target) && !toggle.contains(e.target)) setOpen(false);
    });
  
    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setOpen(false);
    });
  
    // Reset when resizing back to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 640) setOpen(false);
    });
  })();
  </script>
</body>
</html>
