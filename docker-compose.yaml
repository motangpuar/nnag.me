version: "3"

services:
  web:
    image: caddy:alpine
    container_name: hugo-web
    restart: unless-stopped
    network_mode: host          # so cloudflared on the host can reach 127.0.0.1:1313
    working_dir: /srv
    volumes:
      - ./public:/srv:ro
    command: >
      caddy file-server
        --listen 0.0.0.0:1313
        --root /srv
