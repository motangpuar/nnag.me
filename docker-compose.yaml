version: '3.8'

services:
  hugo-nginx:
    image: nginx:alpine
    container_name: hugo-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./helper/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    # Optional: custom nginx config if needed (e.g., for SPA routing)
    # configs:
    #   - source: nginx_conf
    #     target: /etc/nginx/conf.d/default.conf
